<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apresentação | V4 Company Colli&Co</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --v4-red: #e50914;
      --v4-red-hover: #c40712;
      --v4-orange: #ff481f;
      --v4-flame: #f0141e;
      --v4-dark: #280001;
      --v4-darker: #280000;
      --v4-grey: #e1dcdc;
      --v4-white: #ffffff;
      --v4-cream: #ffebc8;
      --v4-salmon: #ffb4a0;
      --ink: #141414;
      --ink-soft: #5a5a5a;
      --line: rgba(20, 20, 20, .12);
      --radius: 22px;
      --radius-pill: 999px;
      --hero: radial-gradient(120% 130% at 50% -10%, #ff5a2c 0%, #e50914 30%, #b00610 62%, #280001 100%);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #171313;
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button { font-family: inherit; }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(229, 9, 20, .18), transparent 38%),
        #171313;
    }

    #deck {
      --deck-scale: 1;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      transform: translate(-50%, -50%) scale(var(--deck-scale));
      transform-origin: center;
      background: #f5f4f2;
      box-shadow: 0 40px 120px rgba(0, 0, 0, .45);
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      padding: 76px 96px 108px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateX(24px);
      transition: opacity .28s ease, transform .28s ease;
      background:
        radial-gradient(circle at 92% 8%, rgba(229, 9, 20, .055), transparent 24%),
        #f5f4f2;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .slide.red {
      color: white;
      background: var(--hero);
    }

    .slide.dark {
      color: white;
      background:
        radial-gradient(circle at 78% 15%, rgba(229, 9, 20, .5), transparent 32%),
        linear-gradient(145deg, #280001 0%, #130001 100%);
    }

    .slide.white { background: white; }

    .topline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--v4-red), var(--v4-orange), transparent 76%);
    }

    h1,
    h2,
    h3,
    p { margin-top: 0; }

    h1 {
      margin-bottom: 24px;
      font-size: 88px;
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 600;
    }

    h2 {
      margin-bottom: 18px;
      font-size: 60px;
      line-height: 1.02;
      letter-spacing: -.045em;
      font-weight: 600;
    }

    h3 {
      margin-bottom: 10px;
      font-size: 26px;
      line-height: 1.1;
      letter-spacing: -.025em;
      font-weight: 600;
    }

    .lede {
      max-width: 1000px;
      color: var(--ink-soft);
      font-size: 27px;
      line-height: 1.42;
      font-weight: 300;
    }

    .red .lede,
    .dark .lede { color: rgba(255, 255, 255, .72); }

    .accent { color: var(--v4-red); }
    .red .accent,
    .dark .accent { color: var(--v4-cream); }

    .mono { font-family: "IBM Plex Mono", monospace; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 15px;
      border: 1px solid rgba(229, 9, 20, .18);
      border-radius: var(--radius-pill);
      color: var(--v4-red);
      background: rgba(229, 9, 20, .07);
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .red .eyebrow,
    .dark .eyebrow {
      color: rgba(255, 255, 255, .92);
      background: rgba(255, 255, 255, .06);
      border-color: rgba(255, 255, 255, .35);
      box-shadow:
        inset 0 0 80px rgba(255, 255, 255, .12),
        inset 0 1px 8px rgba(255, 255, 255, .35),
        -5px 5px 20px rgba(0, 0, 0, .10);
      backdrop-filter: blur(14px) saturate(140%);
    }

    .card {
      position: relative;
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
    }

    .glass {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .06);
      box-shadow:
        inset 0 0 150px rgba(255, 255, 255, .13),
        inset 0 1px 10px rgba(255, 255, 255, .38),
        inset 0 -2px 10px rgba(255, 255, 255, .22),
        inset 0 0 100px rgba(255, 255, 255, .08),
        -5px 5px 20px rgba(0, 0, 0, .10);
      backdrop-filter: blur(14px) saturate(140%);
    }

    .glass::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(120% 90% at 50% 115%, rgba(255, 170, 80, .34), transparent 55%),
        linear-gradient(180deg, rgba(255, 255, 255, .22), transparent 40%);
      mix-blend-mode: screen;
    }

    .sphere {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .38), rgba(255, 255, 255, .045) 48%, transparent 66%);
      box-shadow:
        inset 0 0 120px rgba(255, 255, 255, .13),
        inset 25px 18px 70px rgba(255, 160, 70, .28);
      backdrop-filter: blur(3px);
    }

    .icon {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-box {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(229, 9, 20, .18);
      border-radius: 17px;
      color: var(--v4-red);
      background: rgba(229, 9, 20, .07);
    }

    .red .icon-box,
    .dark .icon-box {
      color: white;
      border-color: rgba(255, 255, 255, .28);
      background: rgba(255, 255, 255, .08);
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }

    .big-number {
      color: var(--v4-red);
      font-size: 72px;
      line-height: 1;
      letter-spacing: -.06em;
      font-weight: 700;
    }

    .metric-label {
      margin-top: 8px;
      color: var(--ink-soft);
      font-size: 16px;
      line-height: 1.2;
    }

    .bullet-list {
      display: grid;
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .bullet-list li {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 76px;
      padding: 14px 18px;
      border: 1px solid rgba(20, 20, 20, .08);
      border-radius: 17px;
      background: rgba(255, 255, 255, .74);
      font-size: 21px;
      line-height: 1.2;
    }

    .hub-layout {
      position: relative;
      height: 540px;
      isolation: isolate;
    }

    .hub-line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 420px;
      height: 420px;
      border: 1px dashed rgba(229, 9, 20, .26);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .hub {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      width: 240px;
      height: 240px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: var(--hero);
      box-shadow: 0 30px 80px rgba(229, 9, 20, .3);
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .hub-node {
      position: absolute;
      z-index: 2;
      width: 240px;
      min-height: 110px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
      animation: node-float 5.2s ease-in-out infinite;
      will-change: transform;
    }

    .node-nw { left: 65px; top: 38px; animation-delay: -.6s; }
    .node-ne { right: 65px; top: 38px; animation-delay: -1.8s; }
    .node-sw { left: 65px; bottom: 38px; animation-delay: -2.8s; }
    .node-se { right: 65px; bottom: 38px; animation-delay: -3.8s; }

    .cover-content {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .brand-lockup img {
      width: 330px;
      display: block;
      object-fit: contain;
    }

    .cover-title {
      max-width: 1100px;
      margin: 28px 0 0;
      font-size: 92px;
    }

    .slide-footer {
      position: absolute;
      z-index: 8;
      left: 96px;
      right: 96px;
      bottom: 32px;
      height: 48px;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .slide-footer img {
      width: 155px;
      height: 48px;
      object-fit: contain;
      object-position: left center;
    }

    .navigation {
      position: absolute;
      z-index: 20;
      right: 52px;
      bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(20, 20, 20, .12);
      border-radius: 50%;
      color: var(--ink);
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, opacity .15s ease;
    }

    .nav-btn:hover { transform: translateY(-2px); background: white; }
    .nav-btn:disabled { opacity: .3; cursor: default; transform: none; }

    .progress-track {
      position: absolute;
      z-index: 21;
      left: 0;
      right: 0;
      bottom: 0;
      height: 7px;
      background: rgba(20, 20, 20, .1);
    }

    .progress-fill {
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, var(--v4-red), var(--v4-orange));
      box-shadow: 0 0 20px rgba(229, 9, 20, .35);
      transition: width .3s ease;
    }

    .slide-counter {
      position: absolute;
      z-index: 22;
      right: 176px;
      bottom: 39px;
      color: rgba(20, 20, 20, .52);
      font: 500 12px/1 "IBM Plex Mono", monospace;
      letter-spacing: .04em;
    }

    @keyframes node-float {
      0%, 100% { transform: var(--node-base, translate(0, 0)) translateY(0) rotate(0deg); }
      25% { transform: var(--node-base, translate(0, 0)) translateY(-9px) rotate(-1.5deg); }
      50% { transform: var(--node-base, translate(0, 0)) translateY(3px) rotate(1deg); }
      75% { transform: var(--node-base, translate(0, 0)) translateY(-5px) rotate(.5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  <div id="viewport">
    <main id="deck" aria-live="polite">
      <!-- Replace every example section with the approved slide content. -->
      <section class="slide red active" data-title="Título aprovado">
        <div class="sphere" style="width:430px;height:430px;right:-80px;top:-115px;opacity:.55"></div>
        <div class="sphere" style="width:245px;height:245px;right:285px;top:115px;opacity:.32"></div>
        <div class="cover-content">
          <div class="brand-lockup">
            <img src="assets/colli-white.png" alt="V4 Company Colli&Co">
          </div>
          <div>
            <span class="eyebrow">Categoria aprovada</span>
            <h1 class="cover-title">Título aprovado</h1>
            <p class="lede">Conteúdo aprovado.</p>
          </div>
        </div>
      </section>

      <section class="slide" data-title="Título aprovado">
        <div class="topline"></div>
        <span class="eyebrow">Categoria aprovada</span>
        <h2 style="margin-top:28px">Título aprovado</h2>
        <div class="grid-2" style="margin-top:42px">
          <div class="card" style="min-height:450px;display:flex;align-items:center;gap:20px">
            <div class="icon-box"><svg class="icon"><use href="#i-target"></use></svg></div>
            <h3>Conteúdo aprovado</h3>
          </div>
          <div class="card" style="min-height:450px;display:flex;align-items:center;gap:20px">
            <div class="icon-box"><svg class="icon"><use href="#i-chart"></use></svg></div>
            <h3>Conteúdo aprovado</h3>
          </div>
        </div>
      </section>

      <div class="slide-footer">
        <img id="footerLogo" src="assets/colli-red.png" alt="">
      </div>

      <div class="slide-counter" id="slideCounter">01 / 02</div>

      <nav class="navigation" aria-label="Navegação da apresentação">
        <button class="nav-btn" id="prevBtn" aria-label="Slide anterior" data-testid="prev-slide">
          <svg class="icon"><use href="#i-arrow-left"></use></svg>
        </button>
        <button class="nav-btn" id="nextBtn" aria-label="Próximo slide" data-testid="next-slide">
          <svg class="icon"><use href="#i-arrow-right"></use></svg>
        </button>
      </nav>

      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </main>
  </div>

  <script>
    const deck = document.getElementById("deck");
    const slides = Array.from(document.querySelectorAll(".slide"));
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressFill = document.getElementById("progressFill");
    const slideCounter = document.getElementById("slideCounter");
    const footerLogo = document.getElementById("footerLogo");
    let current = 0;

    function fitDeck() {
      const viewportWidth =
        window.visualViewport?.width ||
        document.documentElement.clientWidth ||
        window.innerWidth;
      const viewportHeight =
        window.visualViewport?.height ||
        document.documentElement.clientHeight ||
        window.innerHeight;
      const scale = Math.max(
        .1,
        Math.min(
          (viewportWidth - 16) / 1600,
          (viewportHeight - 16) / 900,
          1
        )
      );
      deck.style.setProperty("--deck-scale", scale);
    }

    function goTo(index) {
      current = Math.max(0, Math.min(slides.length - 1, index));
      slides.forEach((slide, slideIndex) => {
        slide.classList.toggle("active", slideIndex === current);
      });

      const number = String(current + 1).padStart(2, "0");
      const total = String(slides.length).padStart(2, "0");
      const activeSlide = slides[current];
      const isDark =
        activeSlide.classList.contains("red") ||
        activeSlide.classList.contains("dark");

      slideCounter.textContent = `${number} / ${total}`;
      slideCounter.style.color = isDark
        ? "rgba(255,255,255,.58)"
        : "rgba(20,20,20,.52)";
      progressFill.style.width = `${((current + 1) / slides.length) * 100}%`;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === slides.length - 1;
      footerLogo.src = isDark
        ? "assets/colli-white.png"
        : "assets/colli-red.png";
      footerLogo.style.opacity =
        current === 0 || current === slides.length - 1 ? "0" : "1";
      document.title =
        `${number} | ${activeSlide.dataset.title || "Apresentação"}`;
    }

    prevBtn.addEventListener("click", () => goTo(current - 1));
    nextBtn.addEventListener("click", () => goTo(current + 1));
    window.addEventListener("resize", fitDeck);
    window.visualViewport?.addEventListener("resize", fitDeck);
    window.addEventListener("keydown", (event) => {
      if (["ArrowRight", "PageDown", " "].includes(event.key)) {
        event.preventDefault();
        goTo(current + 1);
      }
      if (["ArrowLeft", "PageUp"].includes(event.key)) {
        event.preventDefault();
        goTo(current - 1);
      }
      if (event.key === "Home") goTo(0);
      if (event.key === "End") goTo(slides.length - 1);
    });

    let touchStartX = null;
    deck.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    deck.addEventListener("touchend", (event) => {
      if (touchStartX === null) return;
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 70) {
        goTo(current + (delta < 0 ? 1 : -1));
      }
      touchStartX = null;
    }, { passive: true });

    fitDeck();
